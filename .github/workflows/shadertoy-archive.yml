name: Verify Shadertoy archive
on:
  pull_request:
    paths: ['shadertoy/**', 'tools/import_shadertoy.py', 'tools/verify_shadertoy_import.py', '.github/workflows/shadertoy-archive.yml']
  push:
    paths: ['shadertoy/**', 'tools/import_shadertoy.py', 'tools/verify_shadertoy_import.py']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/verify_shadertoy_import.py shadertoy
